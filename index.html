/* Daily recovery + rest decision.
   Recovery: sat out = big recovery, light minutes = good recovery, heavy minutes = normal sleep recovery.
   Rest: tired players sit (rr=1), and now and then a rested-enough veteran/star gets a load-management night (rr=2).
   Limits: never more than 4 sitting per team, load management max 2 per CPU team (1 for you), and teams always keep 10 healthy. */
function enDay(p,t,ix){
